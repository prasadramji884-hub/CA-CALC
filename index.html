<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<title>CA Calc</title>

<meta name="description" content="CA Calc - quick accounting calculator">
<meta name="theme-color" content="#0b0b0d">
<meta name="background-color" content="#0b0b0d">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CA Calc">
<meta name="mobile-web-app-capable" content="yes">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono&display=swap');

:root{
  --bg:#0b0b0d;

  --key-fn:#26262a;
  --key-fn-hi:#34343a;

  --key-digit:#1c1c1f;
  --key-digit-hi:#2a2a2e;

  --key-op:#ff9f0a;
  --key-op-hi:#ffb340;

  --key-ac:#0a84ff;
  --key-ac-hi:#3d9dff;

  --text-light:#ffffff;
  --text-muted:#8e8e93;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overscroll-behavior:none;
}

body{
  margin:0;
  min-height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--bg);

  font-family:'Inter',sans-serif;

  padding-top:max(4px,env(safe-area-inset-top));
  padding-right:max(4px,env(safe-area-inset-right));
  padding-bottom:max(4px,env(safe-area-inset-bottom));
  padding-left:max(4px,env(safe-area-inset-left));

  overflow:hidden;
}

.phone{
  width:100%;
  height:100%;
  max-width:500px;

  padding:4px;

  display:flex;
  flex-direction:column;

  min-height:0;
}


/* =========================
   TOP BAR
========================= */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 6px 6px;

  flex-shrink:0;
}

.brand{
  font-size:11px;
  letter-spacing:1.5px;
  color:var(--text-muted);
  font-weight:600;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}

#ind-m{
  font-size:11px;
  letter-spacing:1.5px;
  font-weight:700;
  color:var(--key-op);
  visibility:hidden;
}

#ind-m.on{
  visibility:visible;
}

.steps-count{
  color:var(--text-muted);
  font-size:11px;
  letter-spacing:1px;
  font-weight:700;
}


/* =========================
   DISPLAY
========================= */

.display-wrap{
  padding:24px 10px 0;

  flex-shrink:0;

  /*
    Fixed height prevents the keypad
    from moving when the result changes.
  */
  height:86px;

  display:flex;
  align-items:flex-start;
  justify-content:flex-end;

  overflow:hidden;
}

.display{
  font-variant-numeric:tabular-nums;

  font-weight:300;

  color:var(--text-light);

  line-height:1;

  letter-spacing:.5px;

  white-space:nowrap;

  overflow:hidden;

  text-align:right;

  width:100%;

  height:62px;
  min-height:62px;

  display:flex;
  align-items:center;
  justify-content:flex-end;

  /*
    No font-size transition.
    Prevents visible flicker.
  */
  transition:none;

  /*
    Keep display on its own compositing layer.
  */
  transform:translateZ(0);
  backface-visibility:hidden;

  contain:layout paint;
}


/* =========================
   OPERATOR INDICATOR
========================= */

.op-indicator{
  height:24px;

  text-align:right;

  padding:0 10px 10px;

  margin-top:-8px;

  font-size:20px;
  font-weight:700;

  color:var(--key-op);

  opacity:0;

  transition:opacity .08s ease;

  flex-shrink:0;
}

.op-indicator.show{
  opacity:1;
}


/* =========================
   KEYPAD
========================= */

.pad{
  display:grid;

  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(6,1fr);

  gap:0;

  flex:1;

  min-height:0;
  min-width:0;
}

button{
  position:relative;

  border:none;
  background:transparent;

  border-radius:0;

  font-family:'Inter',sans-serif;

  font-weight:600;
  font-size:16px;

  cursor:pointer;

  user-select:none;
  -webkit-user-select:none;

  z-index:0;

  touch-action:manipulation;

  container-type:size;

  outline:none;
}

button::before{
  content:'';

  position:absolute;

  top:50%;
  left:50%;

  width:min(90cqw,90cqh);
  height:min(90cqw,90cqh);

  transform:translate(-50%,-50%);

  border-radius:50%;

  z-index:-1;

  transition:
    transform .04s ease,
    filter .05s ease,
    box-shadow .05s ease,
    background .05s ease;
}

button:active::before{
  transform:translate(-50%,-50%) scale(.94);

  filter:brightness(1.35);
}

button:focus-visible::before{
  outline:2px solid rgba(255,255,255,.35);
  outline-offset:3px;
}


/* DIGITS */

.digit{
  color:var(--text-light);
  font-weight:500;
  font-size:20px;
}

.digit::before{
  background:var(--key-digit);
}

.digit:active::before{
  background:var(--key-digit-hi);
}


/* FUNCTIONS */

.fn{
  color:var(--text-light);
  font-size:13.5px;
}

.fn::before{
  background:var(--key-fn);
}

.fn:active::before{
  background:var(--key-fn-hi);
}


/* OPERATORS */

.op{
  color:#1a1200;
  font-size:22px;
}

.op::before{
  background:var(--key-op);
}

.op:active::before{
  box-shadow:
    0 0 14px 3px rgba(255,159,10,.75);
}


/* BLUE OPERATOR */

.op-blue{
  color:var(--text-light);
}

.op-blue::before{
  background:var(--key-ac);
}

.op-blue:active::before{
  box-shadow:
    0 0 14px 3px rgba(10,132,255,.6);
}


/* AC */

.ac-btn{
  color:var(--text-light);
  font-size:13.5px;
}

.ac-btn::before{
  background:var(--key-ac);
}

.ac-btn:active::before{
  background:var(--key-ac-hi);

  box-shadow:
    0 0 14px 3px rgba(10,132,255,.6);
}


/* =========================
   SMALL HEIGHT DEVICES
========================= */

@media (max-height:600px){

  .display-wrap{
    padding-top:10px;
    height:70px;
  }

  .display{
    height:48px;
    min-height:48px;
  }

  .op-indicator{
    height:18px;
  }

}


/* =========================
   SMALL WIDTH
========================= */

@media (max-width:340px){

  .brand,
  #ind-m,
  .steps-count{
    font-size:9px;
  }

  .topbar-right{
    gap:7px;
  }

}
</style>
</head>


<body>

<div class="phone">

  <div class="topbar">

    <span class="brand">CA CALC</span>

    <div class="topbar-right">

      <span id="ind-m">M</span>

      <span class="steps-count" id="stepsCount">
        0 Steps
      </span>

    </div>

  </div>


  <div class="display-wrap">

    <div class="display" id="display">
      0
    </div>

  </div>


  <div class="op-indicator" id="opIndicator"></div>


  <div class="pad">

    <button class="fn" data-fn="plusminus">+/−</button>
    <button class="fn" data-fn="mplus">M+</button>
    <button class="fn" data-fn="mminus">M−</button>
    <button class="fn" data-fn="mrc">MRC</button>

    <button class="fn" data-fn="backspace">⌫</button>
    <button class="fn" data-fn="sqrt">√</button>
    <button class="fn" data-fn="percent">%</button>
    <button class="op" data-fn="divide">÷</button>

    <button class="digit" data-digit="7">7</button>
    <button class="digit" data-digit="8">8</button>
    <button class="digit" data-digit="9">9</button>
    <button class="op" data-fn="subtract">−</button>

    <button class="digit" data-digit="4">4</button>
    <button class="digit" data-digit="5">5</button>
    <button class="digit" data-digit="6">6</button>
    <button class="op op-blue" data-fn="add">+</button>

    <button class="digit" data-digit="1">1</button>
    <button class="digit" data-digit="2">2</button>
    <button class="digit" data-digit="3">3</button>
    <button class="op" data-fn="multiply">×</button>

    <button class="ac-btn" data-fn="ac">AC</button>
    <button class="digit" data-digit="0">0</button>
    <button class="digit" data-fn="point">.</button>
    <button class="op" data-fn="equals">=</button>

  </div>

</div>


<script>
(function(){

'use strict';


/* =========================================================
   DOM
========================================================= */

const displayEl =
  document.getElementById('display');

const indM =
  document.getElementById('ind-m');

const opIndicatorEl =
  document.getElementById('opIndicator');

const stepsCountEl =
  document.getElementById('stepsCount');


/* =========================================================
   CONSTANTS
========================================================= */

const MAX_DIGITS = 12;

const opSymbols = {
  add:'+',
  subtract:'−',
  multiply:'×',
  divide:'÷'
};


/* =========================================================
   STATE
========================================================= */

let display = "0";

let firstOperand = null;

let operator = null;

let waitingForSecond = false;

/*
  TRUE:
  Operator selected but second operand
  hasn't been supplied.

  FALSE:
  A real second operand exists.
*/
let freshOperand = false;


/* Repeated equals */
let lastOperator = null;
let lastOperand = null;


/* Result state */
let justCalculated = false;


/* Memory */
let memory = 0;


/* Steps */
let stepCount = 0;
let operandStarted = false;


/* Last action */
let lastAction = null;


/* Error */
let errorState = false;


/* Display size cache */
let currentDisplaySize = '';


/* =========================================================
   VIBRATION
========================================================= */

function feedback(){

  try{

    if(
      navigator.vibrate &&
      typeof navigator.vibrate === 'function'
    ){

      navigator.vibrate(10);

    }

  }catch(e){}

}


/* =========================================================
   DIGIT COUNT
========================================================= */

function digitCount(value){

  return String(value)
    .replace('-','')
    .replace('.','')
    .replace(/[eE][+-]?\d+$/,'')
    .length;

}


/* =========================================================
   INDIAN NUMBER FORMAT
========================================================= */

function formatForDisplay(raw){

  if(raw === "Error"){

    return "Error";

  }


  if(/e/i.test(raw)){

    return raw;

  }


  const negative =
    raw.startsWith('-');


  const value =
    negative
      ? raw.slice(1)
      : raw;


  const dotIndex =
    value.indexOf('.');


  const intPart =
    dotIndex === -1
      ? value
      : value.slice(0,dotIndex);


  const decimalPart =
    dotIndex === -1
      ? null
      : value.slice(dotIndex + 1);


  const lastThree =
    intPart.slice(-3);


  const other =
    intPart.slice(0,-3);


  let formattedInt =
    lastThree;


  if(other){

    formattedInt =
      other.replace(
        /\B(?=(\d{2})+(?!\d))/g,
        ','
      ) +
      ',' +
      lastThree;

  }


  let result =
    formattedInt;


  if(decimalPart !== null){

    result +=
      '.' + decimalPart;

  }


  return negative
    ? '-' + result
    : result;

}


/* =========================================================
   NUMBER FORMAT
========================================================= */

function formatNum(n){

  if(!Number.isFinite(n)){

    return "Error";

  }


  if(Object.is(n,-0)){

    n = 0;

  }


  const abs =
    Math.abs(n);


  /*
    Scientific notation only for
    genuinely huge/tiny values.
  */

  if(
    n !== 0 &&
    (
      abs >= 1e12 ||
      abs < 1e-9
    )
  ){

    return n.toExponential(6);

  }


  if(Number.isInteger(n)){

    return String(n);

  }


  return parseFloat(
    n.toPrecision(MAX_DIGITS)
  ).toString();

}


/* =========================================================
   DISPLAY FIT
========================================================= */

function fitDisplay(){

  const len =
    formatForDisplay(display).length;


  let size;


  if(len <= 6){

    size = 52;

  }
  else if(len <= 9){

    size = 38;

  }
  else if(len <= 12){

    size = 32;

  }
  else if(len <= 15){

    size = 29;

  }
  else{

    size = 25;

  }


  const newSize =
    size + 'px';


  /*
    Don't touch the style if the size
    hasn't actually changed.
  */

  if(currentDisplaySize !== newSize){

    currentDisplaySize =
      newSize;

    displayEl.style.fontSize =
      newSize;

  }

}


/* =========================================================
   OPERATOR INDICATOR
========================================================= */

function updateOpIndicator(){

  if(operator){

    opIndicatorEl.textContent =
      opSymbols[operator];

    opIndicatorEl.classList.add('show');

  }
  else{

    opIndicatorEl.textContent =
      '';

    opIndicatorEl.classList.remove('show');

  }

}


/* =========================================================
   UPDATE DISPLAY
========================================================= */

function updateDisplay(){

  displayEl.textContent =
    formatForDisplay(display);


  fitDisplay();


  indM.classList.toggle(
    'on',
    Math.abs(memory) > Number.EPSILON
  );


  updateOpIndicator();

}


/* =========================================================
   STEPS
========================================================= */

function bumpStepCount(){

  stepCount++;

  stepsCountEl.textContent =
    stepCount + ' Steps';

}


function markOperandStart(){

  if(!operandStarted){

    operandStarted = true;

    bumpStepCount();

  }

}


function clearSteps(){

  stepCount = 0;

  stepsCountEl.textContent =
    '0 Steps';

}


/* =========================================================
   ERROR
========================================================= */

function recoverFromError(){

  if(!errorState){

    return;

  }


  display = "0";

  firstOperand = null;
  operator = null;

  waitingForSecond = false;
  freshOperand = false;

  lastOperator = null;
  lastOperand = null;

  operandStarted = false;

  justCalculated = false;

  errorState = false;

}


function showError(){

  display = "Error";

  errorState = true;

  firstOperand = null;
  operator = null;

  waitingForSecond = true;
  freshOperand = false;

  lastOperator = null;
  lastOperand = null;

  operandStarted = false;

  justCalculated = false;

}


/* =========================================================
   DIGIT INPUT
========================================================= */

function inputDigit(d){

  if(errorState){

    recoverFromError();

  }


  /*
    Typing after a completed result
    starts a completely new calculation.
  */

  if(justCalculated){

    display = d;

    firstOperand = null;
    operator = null;

    waitingForSecond = false;
    freshOperand = false;

    lastOperator = null;
    lastOperand = null;

    justCalculated = false;

    operandStarted = false;

    markOperandStart();

    return;

  }


  markOperandStart();


  /*
    After operator / sqrt / percent / memory recall,
    next digit replaces display.
  */

  if(waitingForSecond){

    display = d;

    waitingForSecond = false;
    freshOperand = false;

    return;

  }


  if(display === "0"){

    display = d;

    return;

  }


  if(display === "-0"){

    display = "-" + d;

    return;

  }


  if(digitCount(display) >= MAX_DIGITS){

    return;

  }


  display += d;

}


/* =========================================================
   DECIMAL INPUT
========================================================= */

function inputPoint(){

  if(errorState){

    recoverFromError();

  }


  if(justCalculated){

    display = "0.";

    firstOperand = null;
    operator = null;

    waitingForSecond = false;
    freshOperand = false;

    lastOperator = null;
    lastOperand = null;

    justCalculated = false;

    operandStarted = false;

    markOperandStart();

    return;

  }


  markOperandStart();


  if(waitingForSecond){

    display = "0.";

    waitingForSecond = false;
    freshOperand = false;

    return;

  }


  if(!display.includes('.')){

    display += ".";

  }

}


/* =========================================================
   BACKSPACE
========================================================= */

function backspace(){

  if(errorState){

    recoverFromError();

    return;

  }


  if(justCalculated){

    display = "0";

    justCalculated = false;

    return;

  }


  if(waitingForSecond){

    return;

  }


  if(
    display.length <= 1 ||
    (
      display.length === 2 &&
      display.startsWith('-')
    )
  ){

    display = "0";

  }
  else{

    display =
      display.slice(0,-1);

  }

}


/* =========================================================
   ALL CLEAR
========================================================= */

function allClear(){

  display = "0";

  firstOperand = null;
  operator = null;

  waitingForSecond = false;
  freshOperand = false;

  lastOperator = null;
  lastOperand = null;

  operandStarted = false;

  justCalculated = false;

  errorState = false;

  clearSteps();

}


/* =========================================================
   PLUS / MINUS
========================================================= */

function plusMinus(){

  if(errorState){

    recoverFromError();

  }


  /*
    Example:

    400 + +/− 600 =

    => 400 + (-600)
  */

  if(
    waitingForSecond &&
    freshOperand
  ){

    display = "-0";

    waitingForSecond = false;
    freshOperand = false;

    operandStarted = false;

    return;

  }


  if(
    display === "0" ||
    display === "Error"
  ){

    return;

  }


  if(display === "-0"){

    display = "0";

    return;

  }


  display =
    display.startsWith('-')
      ? display.slice(1)
      : '-' + display;

}


/* =========================================================
   SQUARE ROOT
========================================================= */

function sqrtFn(){

  if(errorState){

    recoverFromError();

  }


  const value =
    Number(display);


  if(!Number.isFinite(value)){

    showError();

    return;

  }


  if(value < 0){

    showError();

    return;

  }


  const result =
    Math.sqrt(value);


  display =
    formatNum(result);


  /*
    IMPORTANT FIX:

    √ creates a REAL operand.

    Example:

    5 − 9 √ =

    9 √ => 3

    5 − 3 => 2
  */

  waitingForSecond = true;

  freshOperand = false;

  justCalculated = false;

  operandStarted = true;

}


/* =========================================================
   PERCENT
========================================================= */

function percentFn(){

  if(errorState){

    recoverFromError();

  }


  const current =
    Number(display);


  if(!Number.isFinite(current)){

    showError();

    return;

  }


  let result;


  if(
    (
      operator === 'add' ||
      operator === 'subtract'
    ) &&
    firstOperand !== null
  ){

    result =
      firstOperand *
      (current / 100);

  }
  else{

    result =
      current / 100;

  }


  if(!Number.isFinite(result)){

    showError();

    return;

  }


  display =
    formatNum(result);


  waitingForSecond = true;

  freshOperand = false;

  justCalculated = false;

  operandStarted = true;

}


/* =========================================================
   OPERATOR
========================================================= */

function chooseOperator(op){

  if(errorState){

    recoverFromError();

  }


  /*
    Continue calculation after result.

    Example:

    10 + 5 = 15
    × 2 = 30
  */

  if(justCalculated){

    firstOperand =
      Number(display);

    justCalculated = false;

    lastOperator = null;
    lastOperand = null;

  }


  const inputVal =
    Number(display);


  if(!Number.isFinite(inputVal)){

    showError();

    return;

  }


  /*
    Change operator before second operand.

    10 + ×

    => 10 ×
  */

  if(
    operator &&
    freshOperand
  ){

    operator = op;

    return;

  }


  /*
    First operator.
  */

  if(firstOperand === null){

    firstOperand =
      inputVal;

  }

  /*
    Chain operation.

    10 + 20 +

    => 30 +
  */

  else if(operator){

    const result =
      compute(
        firstOperand,
        inputVal,
        operator
      );


    if(!Number.isFinite(result)){

      showError();

      return;

    }


    firstOperand =
      result;

    display =
      formatNum(result);

  }


  operator =
    op;

  waitingForSecond =
    true;

  freshOperand =
    true;

  operandStarted =
    false;

  lastOperator = null;
  lastOperand = null;

}


/* =========================================================
   COMPUTE
========================================================= */

function compute(a,b,op){

  if(
    !Number.isFinite(a) ||
    !Number.isFinite(b)
  ){

    return NaN;

  }


  switch(op){

    case 'add':
      return a + b;

    case 'subtract':
      return a - b;

    case 'multiply':
      return a * b;

    case 'divide':

      if(b === 0){

        return NaN;

      }

      return a / b;

    default:
      return b;

  }

}


/* =========================================================
   EQUALS
========================================================= */

function equals(){

  bumpStepCount();


  if(errorState){

    return;

  }


  let result;


  /*
    Pending operator
  */

  if(operator){

    const blankSecond =
      freshOperand;


    /*
      If √ or % was used:

      freshOperand = false

      so the display value is used.

      Example:

      5 − 9 √ =

      display = 3

      => 5 − 3
    */

    const inputVal =
      blankSecond
        ? firstOperand
        : Number(display);


    if(!Number.isFinite(inputVal)){

      showError();

      return;

    }


    lastOperator =
      operator;

    lastOperand =
      inputVal;


    /*
      Special case:

      5 ÷ =

      => 1/5
    */

    if(
      operator === 'divide' &&
      blankSecond
    ){

      if(firstOperand === 0){

        showError();

        return;

      }

      result =
        1 / firstOperand;

    }
    else{

      result =
        compute(
          firstOperand,
          inputVal,
          operator
        );

    }

  }


  /*
    Repeated equals
  */

  else if(lastOperator){

    const current =
      Number(display);


    if(!Number.isFinite(current)){

      showError();

      return;

    }


    result =
      compute(
        current,
        lastOperand,
        lastOperator
      );

  }


  /*
    No operator
  */

  else{

    result =
      Number(display);

  }


  if(!Number.isFinite(result)){

    showError();

    return;

  }


  display =
    formatNum(result);

  firstOperand =
    result;

  operator =
    null;

  waitingForSecond =
    true;

  freshOperand =
    false;

  operandStarted =
    false;

  justCalculated =
    true;

}


/* =========================================================
   MEMORY PLUS
========================================================= */

function mplus(){

  if(errorState){

    recoverFromError();

  }


  const value =
    Number(display);


  if(!Number.isFinite(value)){

    return;

  }


  memory += value;


  if(
    Math.abs(memory) <
    Number.EPSILON
  ){

    memory = 0;

  }


  waitingForSecond = true;

  freshOperand = false;

  operandStarted = false;

  justCalculated = false;

}


/* =========================================================
   MEMORY MINUS
========================================================= */

function mminus(){

  if(errorState){

    recoverFromError();

  }


  const value =
    Number(display);


  if(!Number.isFinite(value)){

    return;

  }


  memory -= value;


  if(
    Math.abs(memory) <
    Number.EPSILON
  ){

    memory = 0;

  }


  waitingForSecond = true;

  freshOperand = false;

  operandStarted = false;

  justCalculated = false;

}


/* =========================================================
   MRC
========================================================= */

function mrc(){

  /*
    FIRST MRC
    ----------------
    Recall memory to display.
  */

  if(lastAction !== 'mrc'){

    display =
      formatNum(memory);

    waitingForSecond = true;

    freshOperand = false;

    operandStarted = false;

    justCalculated = false;

    lastAction = 'mrc';

    return;

  }


  /*
    SECOND CONSECUTIVE MRC
    ----------------------
    ONLY CLEAR MEMORY.

    IMPORTANT:
    DO NOT CHANGE DISPLAY.

    So if display = 500,
    second MRC keeps display = 500.
  */

  memory = 0;

  lastAction = null;

}


/* =========================================================
   MAIN HANDLER
========================================================= */

function handle(fn){

  switch(fn){

    case 'ac':
      allClear();
      break;

    case 'backspace':
      backspace();
      break;

    case 'plusminus':
      plusMinus();
      break;

    case 'sqrt':
      sqrtFn();
      break;

    case 'percent':
      percentFn();
      break;

    case 'add':
      chooseOperator('add');
      break;

    case 'subtract':
      chooseOperator('subtract');
      break;

    case 'multiply':
      chooseOperator('multiply');
      break;

    case 'divide':
      chooseOperator('divide');
      break;

    case 'equals':
      equals();
      break;

    case 'mrc':
      mrc();
      break;

    case 'mplus':
      mplus();
      break;

    case 'mminus':
      mminus();
      break;

    case 'point':
      inputPoint();
      break;

  }


  /*
    MRC handles its own consecutive state.
    Do not overwrite lastAction after MRC.
  */

  if(fn !== 'mrc'){

    lastAction = fn;

  }


  updateDisplay();

}


/* =========================================================
   DIGIT EVENTS
========================================================= */

document
  .querySelectorAll('button[data-digit]')
  .forEach(btn => {

    btn.addEventListener(
      'pointerdown',
      function(e){

        e.preventDefault();

        feedback();

        inputDigit(
          btn.dataset.digit
        );

        lastAction = 'digit';

        updateDisplay();

      },
      {
        passive:false
      }
    );

  });


/* =========================================================
   FUNCTION BUTTON EVENTS
========================================================= */

document
  .querySelectorAll('button[data-fn]')
  .forEach(btn => {

    btn.addEventListener(
      'pointerdown',
      function(e){

        e.preventDefault();

        feedback();

        handle(
          btn.dataset.fn
        );

      },
      {
        passive:false
      }
    );

  });


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

document.addEventListener(
  'keydown',
  function(e){

    if(
      e.ctrlKey ||
      e.altKey ||
      e.metaKey
    ){

      return;

    }


    const key =
      e.key;


    if(/^[0-9]$/.test(key)){

      e.preventDefault();

      feedback();

      inputDigit(key);

      lastAction = 'digit';

      updateDisplay();

      return;

    }


    if(
      key === '.' ||
      key === ','
    ){

      e.preventDefault();

      inputPoint();

      lastAction = 'point';

      updateDisplay();

      return;

    }


    if(key === '+'){

      e.preventDefault();

      handle('add');

      return;

    }


    if(key === '-'){

      e.preventDefault();

      handle('subtract');

      return;

    }


    if(key === '*'){

      e.preventDefault();

      handle('multiply');

      return;

    }


    if(key === '/'){

      e.preventDefault();

      handle('divide');

      return;

    }


    if(
      key === '=' ||
      key === 'Enter'
    ){

      e.preventDefault();

      handle('equals');

      return;

    }


    if(key === 'Backspace'){

      e.preventDefault();

      handle('backspace');

      return;

    }


    if(key === 'Escape'){

      e.preventDefault();

      handle('ac');

      return;

    }


    if(key === '%'){

      e.preventDefault();

      handle('percent');

      return;

    }

  }
);


/* =========================================================
   INITIAL DISPLAY
========================================================= */

updateDisplay();


/* =========================================================
   SERVICE WORKER
========================================================= */

if('serviceWorker' in navigator){

  window.addEventListener(
    'load',
    function(){

      navigator.serviceWorker
        .register('./sw.js')
        .catch(function(){});

    }
  );

}

})();
</script>
